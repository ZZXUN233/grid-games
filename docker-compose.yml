version: '3.8'

services:
  grid-games:
    image: localhost:5000/grid-games:latest
    ports:
      - "3004:3004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3004
    restart: unless-stopped
    volumes:
      # Prevent host node_modules from shadowing container
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/api/auth/profile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
