version: '3.8'

services:
  grid-games:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grid-games-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # MySQL connection — override in .env.local for production
      - DB_HOST=${DB_HOST:-192.168.31.200}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-gg}
      - DB_CONNECTION_LIMIT=${DB_CONNECTION_LIMIT:-10}
    env_file:
      - .env.local
    restart: unless-stopped
    volumes:
      # Prevent host node_modules from shadowing container
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/profile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
