# ============================================
# gg.zzxun.cn — 格子熵 · Grid Games
# 后端: 127.0.0.1:3004
#
# 部署方式:
#   1. 将此文件复制到 /etc/nginx/sites-enabled/gg
#   2. nginx -t && nginx -s reload
# ============================================
server {
    listen 443 ssl;
    server_name gg.zzxun.cn;

    # Let's Encrypt 泛域名证书 — 由 acme.sh 自动管理
    ssl_certificate     /etc/nginx/certs/acme/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/acme/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   off;
    server_tokens       off;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000;includeSubDomains;preload";
    add_header X-Frame-Options deny;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https:; connect-src 'self' https:; img-src 'self' data: https: blob:; style-src 'unsafe-inline' https:; font-src https:; frame-src 'self' blob:;" always;

    # 通用设置
    client_max_body_size 10M;

    access_log /var/log/nginx/gg.access.log;
    error_log  /var/log/nginx/gg.error.log;

    # ============================================
    # SPA 前端 + API 转发
    # ============================================

    # 静态资源 — 优先匹配，1 年缓存（Vite 构建带 content hash）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 接口 — 独立 location，短超时 + CORS 防御
    location /api/ {
        proxy_pass http://127.0.0.1:3004/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_redirect off;
        client_max_body_size 10M;

        # CORS 头 — 防御性重复（Express 已处理）
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    }

    # OPTIONS 预检 — nginx 直接返回 204，不转发到后端
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        add_header Access-Control-Max-Age 1728000;
        add_header Content-Type 'text/plain; charset=utf-8';
        add_header Content-Length 0;
        return 204;
    }

    # SPA 根路由 — 所有非 /api/ 非静态资源请求返回 index.html
    location / {
        proxy_pass http://127.0.0.1:3004;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_redirect off;
        client_max_body_size 10M;
    }
}
